[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lekhika"
version = "1.0.3"
description = "A reliable, Linux-first environment for long-form writing"
# Floor is 3.9 by policy (see ROADMAP working agreements): the code only
# needs str.removeprefix (3.9), and every module starts with
# `from __future__ import annotations`, so no X | None annotation is
# evaluated at import. pip resolves a matching PySide6.
requires-python = ">=3.9"
# Stated as a classifier rather than a PEP 639 SPDX string: that form needs
# setuptools 77+, and the build requirement admits 68. The licence text
# is in LICENSE.
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = ["PySide6>=6.6", "python-docx>=1.1", "Pillow>=10",
                "reportlab>=4.0"]

[project.scripts]
lekhika = "lekhika.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

# The guide ships with the software: a Lekhika project the app copies into
# the user's own data folder and opens read-only. It is never opened from
# the install folder, so a user cannot write into it.
#
# The patterns are spelled out because a glob's `*` never matches a name
# that begins with a dot, and a project's order files are named
# `.order.json` — the ones that say in what order a folder's children
# stand.
[tool.setuptools.package-data]
lekhika = [
    "guide/guide.lekhika/*",
    "guide/guide.lekhika/*/*",
    "guide/guide.lekhika/*/*/*",
    "guide/guide.lekhika/*/*/*/*",
    "guide/guide.lekhika/*/.*",
    "guide/guide.lekhika/*/*/.*",
    "guide/guide.lekhika/*/*/*/.*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.optional-dependencies]
cover = ["reportlab>=4.0"]
