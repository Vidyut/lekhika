name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.display_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (free-tier standard runners for public repos)
          - runner: windows-latest
            display_name: windows-x64
            platform: windows
            arch: x64
            artifact_name: Lekhika-windows-x64
            zip_name: Lekhika-windows-x64.zip
            pyinstaller_args: --windowed --icon packaging/lekhika.ico
            archive_shell: pwsh
            archive_cmd: Compress-Archive -Path dist/Lekhika/* -DestinationPath dist/Lekhika-windows-x64.zip
            build_appimage: false
          - runner: windows-11-arm
            display_name: windows-arm64
            platform: windows
            arch: arm64
            artifact_name: Lekhika-windows-arm64
            zip_name: Lekhika-windows-arm64.zip
            pyinstaller_args: --windowed --icon packaging/lekhika.ico
            archive_shell: pwsh
            archive_cmd: Compress-Archive -Path dist/Lekhika/* -DestinationPath dist/Lekhika-windows-arm64.zip
            build_appimage: false

          # Linux (free-tier standard runners for public repos)
          - runner: ubuntu-latest
            display_name: linux-x64
            platform: linux
            arch: x64
            artifact_name: Lekhika-linux-x64
            zip_name: Lekhika-linux-x64.zip
            pyinstaller_args: --windowed
            archive_shell: bash
            archive_cmd: cd dist && zip -r Lekhika-linux-x64.zip Lekhika
            build_appimage: true
            appimage_arch: x86_64
            appimage_name: Lekhika-linux-x86_64.AppImage
            appimage_artifact_name: Lekhika-linux-x86_64-appimage
          - runner: ubuntu-24.04-arm
            display_name: linux-arm64
            platform: linux
            arch: arm64
            artifact_name: Lekhika-linux-arm64
            zip_name: Lekhika-linux-arm64.zip
            pyinstaller_args: --windowed
            archive_shell: bash
            archive_cmd: cd dist && zip -r Lekhika-linux-arm64.zip Lekhika
            build_appimage: true
            appimage_arch: aarch64
            appimage_name: Lekhika-linux-aarch64.AppImage
            appimage_artifact_name: Lekhika-linux-aarch64-appimage

          # macOS (free-tier standard runners for public repos)
          - runner: macos-15-intel
            display_name: macos-intel
            platform: macos
            arch: x64
            artifact_name: Lekhika-macos-intel
            zip_name: Lekhika-macos-intel.zip
            pyinstaller_args: --windowed
            archive_shell: bash
            archive_cmd: cd dist && zip -r Lekhika-macos-intel.zip Lekhika
            build_appimage: false
          - runner: macos-latest
            display_name: macos-arm64
            platform: macos
            arch: arm64
            artifact_name: Lekhika-macos-arm64
            zip_name: Lekhika-macos-arm64.zip
            pyinstaller_args: --windowed
            archive_shell: bash
            archive_cmd: cd dist && zip -r Lekhika-macos-arm64.zip Lekhika
            build_appimage: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2 desktop-file-utils file wget xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --name Lekhika ${{ matrix.pyinstaller_args }} \
            --collect-all lekhika \
            --collect-all PySide6 \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebEngineQuick \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQmlModels \
            --exclude-module PySide6.QtQmlMeta \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtGraphs \
            --exclude-module PySide6.QtGraphsWidgets \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtSerialBus \
            --exclude-module PySide6.QtRemoteObjects \
            --exclude-module PySide6.QtNetworkAuth \
            --exclude-module PySide6.QtDesigner \
            --exclude-module PySide6.QtHelp \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtUiTools \
            --exclude-module PySide6.QtScxml \
            --exclude-module PySide6.QtStateMachine \
            --exclude-module PySide6.QtSpatialAudio \
            --exclude-module PySide6.QtHttpServer \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module PySide6.QtWebChannel \
            --collect-all docx \
            --collect-all reportlab \
            scripts/pyinstaller_entry.py

      - name: Smoke test bundle (Linux)
        if: matrix.platform == 'linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a bash -c 'timeout 15s ./dist/Lekhika/Lekhika >/tmp/lekhika-smoke.log 2>&1; code=$?; echo "--- smoke log ---"; cat /tmp/lekhika-smoke.log || true; echo "--- end smoke log (exit $code) ---"; if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi'

      - name: Smoke test bundle (macOS)
        if: matrix.platform == 'macos'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Best-effort GUI launch check; timeout means it stayed running.
          python3 - <<'PY'
          import subprocess, sys
          p = subprocess.Popen(['./dist/Lekhika/Lekhika'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              out, _ = p.communicate(timeout=15)
              print(out or '')
              if p.returncode not in (0,):
                  sys.exit(p.returncode)
              print(f'Smoke test ok (exit {p.returncode})')
          except subprocess.TimeoutExpired:
              p.kill()
              out, _ = p.communicate()
              print(out or '')
              print('Smoke test ok (kept running)')
          PY

      - name: Smoke test bundle (Windows)
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\Lekhika\Lekhika.exe" -PassThru
          if (-not $p.WaitForExit(15000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "Smoke test ok (kept running)"
            exit 0
          }
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed (exit $($p.ExitCode))"
            exit $p.ExitCode
          }
          Write-Host "Smoke test ok (exit $($p.ExitCode))"

      - name: Report and prune bundle
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          root = Path('dist/Lekhika')
          def size(p):
              if p.is_file():
                  return p.stat().st_size
              return sum(f.stat().st_size for f in p.rglob('*') if f.is_file())

          def fmt(n):
              for u in ['B','KB','MB','GB']:
                  if n < 1024 or u == 'GB':
                      return f'{n:.1f}{u}'
                  n /= 1024

          print('== bundle total ==', fmt(size(root)))
          # Largest top-level entries
          entries = sorted(((size(p), p) for p in root.iterdir()), reverse=True)
          for s,p in entries[:20]:
              print(f'{fmt(s):>10}  {p}')
          internal = root / '_internal'
          if internal.exists():
              print('== top _internal ==')
              for s,p in sorted(((size(p), p) for p in internal.iterdir()), reverse=True)[:20]:
                  print(f'{fmt(s):>10}  {p}')
              qt = None
              for cand in [internal/'PySide6'/'Qt', internal/'PySide6', root/'PySide6'/'Qt']:
                  if cand.exists():
                      qt = cand if cand.name == 'Qt' else cand/'Qt'
                      break
              if qt and qt.exists():
                  print('== Qt subdirs ==')
                  for s,p in sorted(((size(p), p) for p in qt.iterdir() if p.is_dir()), reverse=True)[:20]:
                      print(f'{fmt(s):>10}  {p}')
                  for name in ['translations', 'qml']:
                      d = qt / name
                      if d.exists():
                          s = size(d)
                          shutil.rmtree(d, ignore_errors=True)
                          print(f'PRUNED {name}: {fmt(s)}')
          print('== bundle total after prune ==', fmt(size(root)))
          PY

      - name: Archive build
        shell: ${{ matrix.archive_shell }}
        run: ${{ matrix.archive_cmd }}

      - name: Build AppImage (Linux)
        if: matrix.build_appimage
        shell: bash
        run: |
          set -euo pipefail
          APP=Lekhika
          APPDIR=dist/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r dist/Lekhika/* "$APPDIR/usr/bin/"
          cp packaging/lekhika.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/lekhika.png"
          cp packaging/lekhika.png "$APPDIR/lekhika.png"
          cat > "$APPDIR/usr/share/applications/lekhika.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Lekhika
          Comment=An environment for long-form writing
          Exec=Lekhika
          Icon=lekhika
          Categories=Office;WordProcessor;
          Terminal=false
          EOF
          cp "$APPDIR/usr/share/applications/lekhika.desktop" "$APPDIR/lekhika.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/Lekhika" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          chmod +x appimagetool
          ARCH=${{ matrix.appimage_arch }} ./appimagetool "$APPDIR" "dist/${{ matrix.appimage_name }}"

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.zip_name }}
          if-no-files-found: error

      - name: Upload AppImage artifact (Linux)
        if: matrix.build_appimage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.appimage_artifact_name }}
          path: dist/${{ matrix.appimage_name }}
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.build_appimage
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.appimage_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
