title: Nothing is overwritten
kind: scene

</head><body style=" font-family:'Ubuntu Sans'; font-size:12pt; font-weight:400; font-style:normal;">
<p style=" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;">An import only adds. It never touches a document you already have, and it never replaces a file you have written. If something goes wrong, the imported documents are simply documents you can delete.</p></body></html>
